name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=music_collecter .

      - name: Configure Android SDK and networking
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          text = p.read_text()
          lines = text.splitlines()
          replaced = False
          for i, line in enumerate(lines):
              if 'compileSdk' in line and '=' in line and not line.lstrip().startswith('//'):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = f'{indent}compileSdk = 36'
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('Could not locate compileSdk in android/app/build.gradle.kts')
          p.write_text('\n'.join(lines) + '\n')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android:usesCleartextTraffic=' not in m:
              m = m.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
              manifest.write_text(m)
          PY
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          unzip -t "$APK" >/dev/null
          echo "APK archive integrity: OK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-collecter-v1.0-zen1-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish V1 Zen GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-zen
          name: Music Collector V1.0.0 — Zen
          body: |
            # Music Collector V1.0.0 — Zen

            Minimal Android release focused on a fast, low-friction collection flow.

            - Android release APK
            - Direct-link queue
            - Progress feedback
            - App storage or selected folder
            - Authorized media only

            This release is built automatically by GitHub Actions.
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
